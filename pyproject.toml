[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safevichi"
version = "2.0.0"
description = "SafeViChi v2 — Phát hiện tin nhắn tiếng Việt nguy hại chạy cục bộ (ONNX Runtime INT8)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.24.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.18.0",
    "tokenizers>=0.19.0",
]

[project.optional-dependencies]
export = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "onnx>=1.16.0",
]
dev = [
    "pytest>=8.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
safevichi = "src.v2.predict:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.shared.normalization" = [
    "teencode_dict.json",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "v1/tests"]
