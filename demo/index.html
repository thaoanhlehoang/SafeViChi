<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="SafeViChi — demo trò chuyện và phân tích nội dung độc hại tiếng Việt ngay trên thiết bị."
  />
  <title>SafeViChi — Demo trò chuyện an toàn</title>
  <link rel="icon" type="image/png" href="./assets/brand/safevichi-mark.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <div class="brand" aria-label="SafeViChi">
        <img class="brand-mark" src="./assets/brand/safevichi-mark.png" alt="" />
        <div class="brand-name">Safe<span>ViChi</span></div>
      </div>

      <div class="brand-copy">Phát hiện nội dung độc hại tiếng Việt · Xử lý ngay trên thiết bị</div>

      <div class="model-status-wrap">
        <button
          class="model-status"
          id="modelLoadButton"
          data-state="idle"
          type="button"
          aria-describedby="modelStatusAnnouncement"
        >
          <span class="status-dot" aria-hidden="true"></span>
          <span id="modelStatusText">Tải mô hình · khoảng 1,09 GB</span>
        </button>
        <span id="modelStatusAnnouncement" class="sr-only" aria-live="polite"></span>
      </div>

      <button class="profile-button" type="button" aria-label="Tài khoản demo">
        <img src="./assets/avatars/hoang-nam.png" alt="" />
      </button>
    </header>

    <main class="workspace">
      <aside class="conversation-panel" id="conversationPanel" aria-label="Danh sách cuộc trò chuyện">
        <div class="conversation-search">
          <label class="search-control" for="conversationSearch">
            <span class="material-symbols-rounded" aria-hidden="true">search</span>
            <span class="sr-only">Tìm kiếm cuộc trò chuyện</span>
            <input
              id="conversationSearch"
              type="search"
              autocomplete="off"
              placeholder="Tìm kiếm cuộc trò chuyện…"
            />
          </label>
        </div>

        <div class="conversation-list" id="conversationList"></div>

        <footer class="inbox-footer">
          <span class="footer-icon"><span class="material-symbols-rounded" aria-hidden="true">calendar_today</span></span>
          <span>Hôm nay<br /><strong>Thứ Năm, 10 tháng 9 năm 2026</strong></span>
        </footer>
      </aside>

      <section class="chat-panel" aria-label="Cuộc trò chuyện đang mở">
        <header class="chat-header">
          <button
            class="icon-button mobile-menu-button"
            id="openConversationsButton"
            type="button"
            aria-label="Mở danh sách trò chuyện"
          >
            <span class="material-symbols-rounded" aria-hidden="true">menu</span>
          </button>

          <div class="avatar-wrap is-online" id="activeAvatarWrap">
            <img class="avatar" id="activeAvatar" src="./assets/avatars/minh-anh.png" alt="" />
            <span class="online-dot" aria-hidden="true"></span>
          </div>

          <div class="chat-title">
            <h1 id="activeConversationName">Minh Anh</h1>
            <div class="chat-presence" id="activeConversationPresence">
              <span class="presence-dot" aria-hidden="true"></span>
              <span>Đang hoạt động</span>
            </div>
          </div>

          <div class="chat-tools" aria-label="Công cụ cuộc trò chuyện">
            <button class="icon-button" type="button" aria-label="Gọi thoại">
              <span class="material-symbols-rounded" aria-hidden="true">call</span>
            </button>
            <button class="icon-button" type="button" aria-label="Gọi video">
              <span class="material-symbols-rounded" aria-hidden="true">videocam</span>
            </button>
            <button class="icon-button" type="button" aria-label="Thêm tùy chọn">
              <span class="material-symbols-rounded" aria-hidden="true">more_vert</span>
            </button>
          </div>
        </header>

        <div class="message-list" id="messageList" aria-live="polite"></div>

        <div class="composer-wrap">
          <form class="composer" id="messageComposer">
            <button class="icon-button" type="button" aria-label="Đính kèm tệp">
              <span class="material-symbols-rounded" aria-hidden="true">attach_file</span>
            </button>
            <label class="sr-only" for="messageInput">Nhập tin nhắn</label>
            <textarea
              id="messageInput"
              rows="1"
              maxlength="256"
              placeholder="Nhập tin nhắn…"
            ></textarea>
            <button class="send-button" id="sendButton" type="submit" aria-label="Gửi tin nhắn">
              <span class="material-symbols-rounded" aria-hidden="true">send</span>
            </button>
          </form>
        </div>
      </section>

    </main>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
