# Bảng kịch bản sinh câu v2 (generate.py). Người nhận tin luôn là học sinh THCS, THPT hoặc sinh viên.
# Mỗi ô = kịch bản × kênh × giọng × độ lộ (kèm một kiểu lộ); mỗi ô sinh 5 đoạn hội thoại.
# text là đoạn nhiều dòng, mỗi dòng một tin nhắn, không có nhãn người nói.
# Mỗi ô nguy hại có một ô "sinh đôi" AN_TOAN cùng kênh, giọng, kiểu lộ.
# giu_ngoai_train: true = KHÔNG sinh vào train, để làm cột "kịch bản chưa thấy" khi đánh giá.
# vi_du: 3–5 câu thật lấy từ phần mẫu (KHÔNG BAO GIỜ lấy câu test). Chưa có thì để [].
# Sửa file này là đổi dữ liệu train: ghi lại khi commit. Bảng đọc được: docs/v2/KICH_BAN.md.

kenh:
  messenger_zalo: "tin nhắn riêng qua Messenger hoặc Zalo"
  nhom_lop: "tin nhắn trong nhóm chat của lớp"
  chat_game: "khung chat trong game (Liên Quân, Free Fire, Roblox, Minecraft...)"
  binh_luan: "bình luận dưới bài đăng TikTok hoặc Facebook"
  sms: "tin nhắn SMS"

giong:
  teencode: "teencode Gen Z, viết tắt và từ lóng giới trẻ"
  than_mat: "thân mật kiểu bạn bè, có dấu"
  khong_dau: "gõ không dấu"
  viet_tat: "viết tắt nhiều, gõ vội, sai chính tả, thiếu dấu câu"
  giong_bac: "giọng miền Bắc"
  giong_trung: "giọng miền Trung"
  giong_nam: "giọng miền Nam"
  trang_trong_gia_danh: "trang trọng, giả giọng admin, shop, nhà tuyển dụng hoặc tổ chức"

do_lo:
  lo_lieu: "lộ liễu: ý đồ thể hiện rõ ngay trong câu"
  an_y: "ẩn ý: ý đồ nói tránh, vòng vo, lịch sự giả tạo, phải đọc kỹ mới thấy"

# Số đoạn nguy hại mục tiêu mỗi nhãn (phương án train 15.000 câu, chốt 20/11). Mỗi kịch bản có
# (kênh hội thoại × 2 kiểu lộ + kênh một dòng) × số giọng × 2 độ lộ ô; nếu mục tiêu cần ít ô hơn, script chọn đều
# các ô đó. Ô sinh đôi AN_TOAN đi theo ô nguy hại (cùng số lượng). XUC_PHAM chỉ sinh hội thoại nhiều dòng để mô hình
# không học mẹo "nhiều dòng = nhãn hiếm" (câu XUC_PHAM thật của 3 bộ đều là bình luận một dòng).
muc_tieu_doan:
  LUA_DAO: 2000
  DE_DOA: 1500
  QUAY_ROI: 1500
  XUC_PHAM: 500

# Kiểu lộ: ý đồ xuất hiện ở đâu trong đoạn hội thoại.
kieu_lo:
  ngay_dau: "lộ ngay từ dòng đầu"
  lo_dan: "vài dòng đầu nói chuyện bình thường, ý đồ chỉ lộ ở các dòng cuối"
  mot_dong: "chỉ 1 dòng (một tin nhắn duy nhất)"

# Kênh chỉ sinh đoạn 1 dòng (bình luận, SMS). Các kênh khác sinh hội thoại nhiều dòng,
# luân phiên ngay_dau / lo_dan theo ô để giữ tổng số lượt gọi.
kenh_mot_dong: [binh_luan, sms]

# Mô tả độ lộ cho ô sinh đôi AN_TOAN (cùng mã do_lo với ô nguy hại tương ứng).
do_lo_sinh_doi:
  lo_lieu: "an toàn nhưng dùng nhiều từ ngữ, chủ đề giống tin nguy hại nên rất dễ bị nhầm"
  an_y: "an toàn, cùng chủ đề, viết tự nhiên bình thường"

