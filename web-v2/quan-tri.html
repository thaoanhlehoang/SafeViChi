<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Kiểm duyệt và quản trị · SafeViChi</title>
  <script type="module" src="/src/quan_tri/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">S</span>
        <strong>SafeViChi</strong>
      </a>
      <div class="topbar-actions">
        <a class="text-link" href="/">Trang chủ</a>
        <label id="demo-switch" class="demo-switch" hidden>Vai trò demo
          <select id="demo-role"></select>
        </label>
        <button class="button quiet" id="sign-out" type="button" hidden>Đăng xuất</button>
      </div>
    </div>
  </header>

  <main class="entry" id="entry">
    <section class="sign-in" aria-labelledby="entry-title">
      <div class="entry-intro">
        <h1 id="entry-title">Kiểm duyệt<br>và quản trị</h1>
        <p>Xem xét phản hồi đã che thông tin, thống kê mức 1 và thay đổi ngưỡng mô hình.</p>
      </div>
      <div class="entry-controls">
        <section id="demo-entry" class="entry-form" hidden aria-labelledby="demo-title">
          <h2 id="demo-title">Chọn vai trò demo</h2>
          <p class="muted">Thử luồng kiểm duyệt và quản trị trên dữ liệu trình diễn.</p>
          <div id="demo-roles" class="demo-roles"></div>
        </section>
        <form id="sign-in" class="entry-form" hidden>
          <h2>Đăng nhập nội bộ</h2>
          <label class="field">Mã truy cập
            <input id="token" type="password" required autocomplete="off" spellcheck="false" maxlength="128">
          </label>
          <button class="button primary" type="submit">Vào khu vực nội bộ</button>
        </form>
        <p id="sign-in-status" class="notice" role="status">Đang tải chế độ truy cập…</p>
        <button class="button" id="retry-entry" type="button" hidden>Thử lại</button>
      </div>
    </section>
  </main>

  <main class="workspace" id="workspace" hidden>
    <aside class="workspace-nav">
      <div class="account">
        <span class="account-mark" id="actor-mark" aria-hidden="true"></span>
        <div><strong id="actor-id"></strong><span id="actor-role"></span></div>
      </div>
      <nav id="navigation" aria-label="Khu vực nội bộ"></nav>
    </aside>
    <section class="workspace-content" aria-labelledby="screen-title">
      <header class="screen-header">
        <h1 id="screen-title" tabindex="-1"></h1>
        <p id="screen-description"></p>
      </header>
      <div id="screen"></div>
    </section>
  </main>
</body>
</html>
